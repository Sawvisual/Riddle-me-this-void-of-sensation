<script src="turn.js"></script>
<script>
  $(document).ready(function() {
    var $flipbook = $(".flipbook");
    var originalWidth = 1000;
    var originalHeight = 770;
    var resizeTimer;

    // Initialize turn.js with original size
    $flipbook.turn({
    width: originalWidth,
    height: originalHeight,
    autoCenter: true,
    gradients: true,
    acceleration: true,
    display: "double",
    turnCorners: "bl,br", 
});

    function resizeFlipbook() {
        // Get available viewport space (subtract body padding)
        var viewportWidth = window.innerWidth - 40;
        var viewportHeight = window.innerHeight - 40;

        // Calculate new size preserving original aspect ratio
        var aspect = originalWidth / originalHeight;
        var newWidth = viewportWidth;
        var newHeight = newWidth / aspect;

        if (newHeight > viewportHeight) {
            newHeight = viewportHeight;
            newWidth = newHeight * aspect;
        }

        // Apply new dimensions to the flipbook element
        $flipbook.css({
            width: newWidth,
            height: newHeight
        });

        // Tell turn.js to update its internal geometry
        $flipbook.turn("size", newWidth, newHeight);

        // Force a redraw to fix any glitches after resize
        $flipbook.turn("resize");
    }

    // Initial resize
    resizeFlipbook();

    // Debounced resize event to avoid performance issues
    $(window).on("resize", function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            resizeFlipbook();
        }, 150);
    });

    // Optional: handle orientation change on mobile
    $(window).on("orientationchange", function() {
        setTimeout(resizeFlipbook, 100);
    });
  });
</script>
